name: Scarica popolazione

# Scarica la popolazione usata per gli abitanti entro 5 minuti dai punti e per l'analisi di
# copertura: la griglia del censimento 2022 a 100 m (scripts/fetch_zensus.py). Cambia di
# rado (il prossimo censimento è nel 2031): si avvia a mano. Alla fine ricostruisce la mappa.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Popolazione Zensus 2022 (celle di 100 m)
        run: python -u scripts/fetch_zensus.py 2>&1 | tee data/popolazione_log.txt
      - name: Riepilogo del log
        if: always()
        run: tail -8 data/popolazione_log.txt | sed "s|^|::notice title=popolazione::|" || true
      - run: python scripts/prepare_territorium.py
      - run: python scripts/build_data.py
      - run: python scripts/build_copertura.py
      - name: Commit e push
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/popolazione_log.txt webapp/public/municipalities.json webapp/public/data
          if [ -f data/popolazione_zensus_100m.csv.gz ]; then git add data/popolazione_zensus_100m.csv.gz; fi
          git diff --staged --quiet && exit 0
          git commit -q -m "🤖 Popolazione Zensus 2022 e mappa ricostruita - $(date +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 15))
          done
          exit 1
